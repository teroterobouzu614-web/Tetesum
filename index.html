<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tetesum</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17202d;
      --muted: #667080;
      --line: #fff;
      --bad: #cf233d;
      --good: #247553;
      --size: 6;
      --cell: min(8.2vw, calc((100dvh - 176px) / (var(--size) + 1)), 36px);
      --target: calc(var(--cell) * .92);
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-height: 100vh;
      min-height: 100dvh;
      overflow-x: hidden;
      overflow-y: auto;
      color: var(--ink);
      font-family: "Segoe UI", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      background: #fff;
    }

    button {
      min-height: 40px;
      border: 0;
      border-radius: 8px;
      background: #eef2f8;
      color: var(--ink);
      font: inherit;
      font-weight: 850;
      cursor: pointer;
      box-shadow: none;
    }

    .screen {
      display: none;
      width: min(1080px, calc(100% - 20px));
      min-height: 100dvh;
      margin: 0 auto;
      padding: 16px 0;
    }

    .screen.active { display: grid; }

    .title-screen {
      place-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      background:
        linear-gradient(120deg, rgba(255, 246, 179, .95), rgba(255,255,255,.92) 36%, rgba(194, 241, 255, .94) 70%, rgba(255, 210, 224, .94)),
        #fff;
    }

    .title-screen::before,
    .title-screen::after {
      content: "";
      position: absolute;
      width: min(42vw, 320px);
      aspect-ratio: 1;
      border: 18px solid rgba(255,255,255,.55);
      border-radius: 50%;
      pointer-events: none;
      animation: titleOrb 7.5s ease-in-out infinite alternate;
    }

    .title-screen::before { left: -90px; top: 9%; background: rgba(255, 213, 86, .32); }
    .title-screen::after { right: -80px; bottom: 8%; background: rgba(71, 199, 227, .28); animation-delay: -2.2s; }

    .title-motion {
      position: absolute;
      inset: 0;
      pointer-events: none;
      overflow: hidden;
    }

    .title-ribbon {
      position: absolute;
      left: -18vw;
      width: 136vw;
      height: clamp(54px, 11vw, 122px);
      border-block: 4px solid rgba(255,255,255,.72);
      opacity: .78;
      transform: skewY(-8deg);
      filter: drop-shadow(0 14px 18px rgba(23,32,45,.10));
      animation: ribbonSweep 6.8s ease-in-out infinite;
    }

    .title-ribbon.one {
      top: 12%;
      background: linear-gradient(90deg, transparent, rgba(255,73,104,.72), rgba(255,216,86,.76), transparent);
    }

    .title-ribbon.two {
      bottom: 13%;
      background: linear-gradient(90deg, transparent, rgba(71,199,227,.70), rgba(126,100,232,.58), transparent);
      animation-delay: -3.1s;
      transform: skewY(7deg);
    }

    .title-tile {
      position: absolute;
      width: clamp(58px, 10vw, 118px);
      aspect-ratio: 1;
      border: 5px solid rgba(255,255,255,.86);
      border-radius: 18px;
      box-shadow: inset 0 3px 0 rgba(255,255,255,.62), 0 18px 34px rgba(23,32,45,.13);
      opacity: .88;
      animation: tileFloat 5.8s ease-in-out infinite;
    }

    .title-tile.a { left: 7%; top: 18%; background: linear-gradient(145deg, #ff7891, #ffd96d); }
    .title-tile.b { right: 8%; top: 16%; background: linear-gradient(145deg, #66d6f2, #8fe98e); animation-delay: -1.8s; }
    .title-tile.c { left: 13%; bottom: 12%; background: linear-gradient(145deg, #b9a2ff, #ffad71); animation-delay: -3.2s; }
    .title-tile.d { right: 14%; bottom: 14%; background: linear-gradient(145deg, #ffd96d, #ff7891); animation-delay: -4.4s; }

    .title-flash {
      position: absolute;
      inset: -18% -34%;
      background: linear-gradient(105deg, transparent 36%, rgba(255,255,255,.75) 48%, transparent 60%);
      transform: translateX(-65%);
      animation: titleFlash 5.2s ease-in-out infinite;
    }

    .title-box {
      width: min(780px, 94vw);
      padding: clamp(34px, 8vw, 72px) 18px;
      position: relative;
      z-index: 1;
      animation: titleBoxIn .78s cubic-bezier(.18, .86, .2, 1.08) both;
    }

    .title-logo-wrap,
    .title-logo-img {
      display: none;
    }

    .title-wordmark {
      position: relative;
      display: grid;
      gap: 8px;
      justify-items: center;
      margin: 0 auto;
    }

    .title-wordmark-img {
      display: none;
      width: min(92vw, 760px);
      height: auto;
      margin: 0 auto;
      filter: drop-shadow(0 16px 20px rgba(23,32,45,.15));
      animation: titleHeadlineIn .72s .18s cubic-bezier(.18, .86, .2, 1.08) both;
    }

    h1 {
      margin: 0;
      color: transparent;
      font-size: clamp(2.9rem, 9vw, 7.2rem);
      line-height: .88;
      letter-spacing: 0;
      position: relative;
      width: auto;
      transform: none;
      background: linear-gradient(105deg, #ff325f 0%, #ff7a39 34%, #15aed1 66%, #7657e8 100%);
      -webkit-background-clip: text;
      background-clip: text;
      text-shadow: none;
      filter: drop-shadow(0 10px 16px rgba(23,32,45,.16));
      animation: titleHeadlineIn .72s .18s cubic-bezier(.18, .86, .2, 1.08) both;
    }

    .title-fallback {
      position: relative;
      width: auto;
      height: auto;
      padding: 0;
      margin: 0;
      overflow: visible;
      clip: auto;
      white-space: normal;
      border: 0;
    }

    .title-fallback::before,
    .title-fallback::after {
      display: none;
    }

    h1::before,
    h1::after {
      content: "";
      display: block;
      width: min(72vw, 560px);
      height: 3px;
      margin: 0 auto 16px;
      border-radius: 999px;
      background: linear-gradient(90deg, transparent, #ff4968, #55cde9, transparent);
      opacity: .9;
    }

    h1::after {
      margin: 18px auto 0;
      height: 2px;
      opacity: .55;
    }

    .title-actions {
      display: flex;
      justify-content: center;
      flex-wrap: wrap;
      gap: 12px;
      margin-top: 28px;
      position: relative;
      z-index: 1;
      animation: titleTextIn .7s .36s cubic-bezier(.18, .86, .2, 1.08) both;
    }

    .image-button {
      width: min(40vw, 210px);
      min-width: 150px;
      min-height: 48px;
      border: 2px solid rgba(255,255,255,.88);
      border-radius: 12px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0) 44%),
        linear-gradient(135deg, #ff4968, #ff8f3d);
      color: #fff;
      font-size: clamp(1.05rem, 2.4vw, 1.35rem);
      font-weight: 950;
      text-shadow: 0 2px 0 rgba(71,24,40,.22);
      box-shadow: inset 0 2px 0 rgba(255,255,255,.55), inset 0 -4px 0 rgba(23,32,45,.12), 0 10px 18px rgba(23,32,45,.14);
      filter: none;
      transition: transform .14s ease, filter .14s ease;
    }

    .image-button:hover {
      transform: translateY(-2px) scale(1.02);
      filter: saturate(1.08);
    }

    .image-button:active {
      transform: translateY(3px) scale(.99);
      box-shadow: inset 0 2px 0 rgba(255,255,255,.46), inset 0 -2px 0 rgba(23,32,45,.12), 0 5px 10px rgba(23,32,45,.12);
    }

    .image-button.start {
      background:
        linear-gradient(180deg, rgba(255,255,255,.55), rgba(255,255,255,0) 44%),
        linear-gradient(135deg, #ff4968, #ff8f3d);
    }

    .image-button.gallery {
      background:
        linear-gradient(180deg, rgba(255,255,255,.58), rgba(255,255,255,0) 44%),
        linear-gradient(135deg, #1fc1e5, #6f68ec);
      color: #fff;
      text-shadow: 0 2px 0 rgba(12,73,101,.28);
    }

    .lead {
      margin: 14px auto 24px;
      max-width: 520px;
      color: var(--muted);
      line-height: 1.55;
      font-weight: 720;
    }

    .primary {
      min-width: 184px;
      min-height: 50px;
      border-color: #fff;
      background: linear-gradient(180deg, #fff7b8, #ffcf43 55%, #f5a921);
      box-shadow: inset 0 3px 0 rgba(255,255,255,.72), inset 0 -4px 0 rgba(163,95,12,.18), 0 10px 0 rgba(218,128,23,.22), 0 20px 36px rgba(23,32,45,.16);
      color: #4c2c00;
      font-size: 1.08rem;
    }

    @keyframes titleBoxIn {
      from { opacity: 0; transform: translateY(34px) scale(.94); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes titleTextIn {
      from { opacity: 0; transform: translateY(18px); filter: blur(4px); }
      to { opacity: 1; transform: translateY(0); filter: blur(0); }
    }

    @keyframes titleHeadlineIn {
      from { opacity: 0; transform: translateY(18px); filter: blur(4px) drop-shadow(0 10px 16px rgba(23,32,45,.16)); }
      to { opacity: 1; transform: translateY(0); filter: blur(0) drop-shadow(0 10px 16px rgba(23,32,45,.16)); }
    }

    @keyframes ribbonSweep {
      0%, 100% { opacity: .18; transform: translateX(-12%) skewY(-8deg); }
      35%, 65% { opacity: .82; }
      50% { transform: translateX(12%) skewY(-8deg); }
    }

    @keyframes tileFloat {
      0%, 100% { opacity: .22; transform: translateX(-34px) translateY(18px) rotate(-8deg) scale(.9); }
      22%, 72% { opacity: .9; }
      50% { transform: translateX(28px) translateY(-20px) rotate(9deg) scale(1.04); }
    }

    @keyframes titleFlash {
      0%, 62%, 100% { opacity: 0; transform: translateX(-65%); }
      72% { opacity: .9; }
      86% { opacity: 0; transform: translateX(65%); }
    }

    @keyframes titleOrb {
      from { transform: translate3d(0,0,0) scale(1); }
      to { transform: translate3d(24px,-18px,0) scale(1.08); }
    }

    @keyframes titleMeter {
      0%, 100% { transform: translateX(-22%); opacity: .45; }
      50% { transform: translateX(22%); opacity: .9; }
    }

    @keyframes stageSweep {
      from { transform: translateX(-6%) translateY(0); opacity: .58; }
      to { transform: translateX(6%) translateY(8px); opacity: .86; }
    }

    @keyframes stageFloat {
      from { transform: translate3d(0, -8px, 0); }
      to { transform: translate3d(0, 10px, 0); }
    }

    .stage-screen {
      align-content: start;
      gap: 14px;
      overflow: auto;
      padding-inline: 10px;
      position: relative;
      background:
        linear-gradient(180deg, rgba(232, 249, 255, .96) 0%, rgba(249,255,244,.98) 48%, rgba(218, 244, 203, .98) 100%),
        radial-gradient(circle at 12% 16%, rgba(255, 223, 112, .22), transparent 24%),
        radial-gradient(circle at 86% 18%, rgba(128, 207, 255, .18), transparent 26%),
        radial-gradient(circle at 52% 100%, rgba(98, 190, 96, .18), transparent 32%);
    }

    .stage-screen::before,
    .stage-screen::after {
      content: "";
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 0;
    }

    .stage-screen::before {
      background:
        linear-gradient(105deg, transparent 10%, rgba(255, 255, 255, .34) 24%, transparent 42%),
        linear-gradient(180deg, transparent 58%, rgba(111, 198, 91, .18) 59%, rgba(91, 176, 82, .16) 100%),
        repeating-linear-gradient(96deg, transparent 0 34px, rgba(96, 172, 74, .10) 35px 39px, transparent 40px 78px);
      transform: translateX(-6%);
      animation: stageSweep 8s ease-in-out infinite alternate;
    }

    .stage-screen::after {
      background:
        radial-gradient(circle at 14% 76%, rgba(255, 219, 112, .26) 0 54px, transparent 58px),
        radial-gradient(circle at 84% 72%, rgba(255, 151, 178, .12) 0 42px, transparent 46px),
        radial-gradient(circle at 72% 28%, rgba(255,255,255,.62) 0 34px, transparent 38px);
      opacity: .82;
      animation: stageFloat 7s ease-in-out infinite alternate;
    }

    .screen-head {
      display: flex;
      align-items: end;
      justify-content: space-between;
      gap: 12px;
      position: relative;
      z-index: 1;
    }

    .screen-head h2 {
      margin: 0;
      font-size: clamp(2rem, 5vw, 3.6rem);
      letter-spacing: 0;
      color: #243044;
      text-shadow: 0 1px 0 #fff;
    }

    #stageBackButton {
      min-height: 40px;
      padding: 0 14px;
      border: 1px solid rgba(195,205,220,.9);
      background: rgba(255,255,255,.82);
      color: #445064;
      box-shadow: 0 6px 16px rgba(23,32,45,.08), inset 0 1px 0 rgba(255,255,255,.9);
    }

    .stage-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(54px, 64px));
      justify-content: center;
      gap: 8px;
      padding: 8px 0 18px;
      position: relative;
      z-index: 1;
    }

    .stage-card {
      width: 60px;
      height: 46px;
      min-height: 46px;
      padding: 0;
      display: grid;
      place-items: center;
      text-align: center;
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      isolation: isolate;
      border: 1px solid #c8d2e1;
      background:
        linear-gradient(180deg, #fff, #f3f7fc 64%, #e7eef8);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,.92),
        inset 0 -3px 0 rgba(80,96,122,.10),
        0 4px 10px rgba(23,32,45,.10);
      transform: translateY(0);
      transition: transform .12s ease, border-color .12s ease, box-shadow .12s ease;
    }

    .stage-card:nth-child(6n + 1) { --stage-a: #ff8ca0; --stage-b: #ff4d72; }
    .stage-card:nth-child(6n + 2) { --stage-a: #66d6f2; --stage-b: #22aeda; }
    .stage-card:nth-child(6n + 3) { --stage-a: #ffd96d; --stage-b: #f2aa25; --stage-ink: #563600; }
    .stage-card:nth-child(6n + 4) { --stage-a: #8fe98e; --stage-b: #32bd63; }
    .stage-card:nth-child(6n + 5) { --stage-a: #b9a2ff; --stage-b: #7d64e8; }
    .stage-card:nth-child(6n) { --stage-a: #ffad71; --stage-b: #f06f37; }

    .stage-card:hover {
      border-color: #62bfe4;
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,.92),
        inset 0 -3px 0 rgba(80,96,122,.10),
        0 5px 12px rgba(23,32,45,.12),
        0 0 0 3px rgba(98,191,228,.12);
      transform: translateY(-1px);
    }

    .stage-card:active {
      transform: translateY(3px);
      box-shadow:
        inset 0 2px 0 rgba(255,255,255,.58),
        inset 0 -2px 0 rgba(40,45,65,.18),
        0 2px 5px rgba(17,24,39,.10);
    }

    .stage-card strong {
      display: block;
      color: #263247;
      font-size: 1.26rem;
      line-height: 1;
      text-shadow: 0 1px 0 #fff;
    }

    .stage-card .check {
      position: absolute;
      right: 4px;
      top: 4px;
      width: 18px;
      height: 18px;
      border: 1px solid #fff;
      border-radius: 50%;
      display: none;
      place-items: center;
      background: linear-gradient(180deg, #48df89, #16a85a);
      color: #fff;
      font-size: .72rem;
      text-shadow: none;
      box-shadow: 0 2px 5px rgba(17,24,39,.18), inset 0 1px 0 rgba(255,255,255,.35);
    }

    .stage-card.completed .check {
      display: grid;
    }

    .game-screen {
      height: 100dvh;
      grid-template-rows: 48px minmax(0, 1fr) 64px;
      gap: 8px;
      align-content: center;
      justify-items: center;
      position: relative;
    }

    .status {
      min-height: 36px;
      border: 0;
      border-radius: 0;
      background: transparent;
      padding: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      font-weight: 850;
      width: 100%;
    }

    .status span { color: var(--muted); }
    .status-meta,
    #backToStages,
    .status span {
      display: none;
    }

    .hearts {
      color: #ff2c55;
      letter-spacing: 5px;
      font-size: 1.35rem;
      line-height: 1;
    }

    .tools {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 12px;
      order: 4;
      width: 100%;
    }

    .tool {
      width: min(42vw, 150px);
      height: 52px;
      min-height: 52px;
      border: 2px solid #fff;
      border-radius: 10px;
      color: inherit;
      font-size: 1.05rem;
      position: relative;
      box-shadow: inset 0 3px 0 rgba(255,255,255,.45), inset 0 -4px 0 rgba(17,24,39,.12), 0 8px 18px rgba(17,24,39,.12);
    }

    #confirmTool {
      background: linear-gradient(180deg, #ff8797 0%, #f3485d 55%, #be2034 100%);
      color: #fff;
      order: 1;
    }

    #eraseTool {
      background: linear-gradient(180deg, #b8f6ff 0%, #5bd4ed 55%, #22a9cc 100%);
      color: #063c4d;
      order: 2;
    }

    .tool.active {
      outline: 3px solid #1ea7ff;
      outline-offset: 2px;
      transform: translateY(1px);
      filter: none;
    }

    #backToStages {
      min-height: 46px;
      align-self: center;
      padding: 0 12px;
    }

    .game-exit {
      position: absolute;
      right: max(10px, env(safe-area-inset-right));
      top: max(8px, env(safe-area-inset-top));
      z-index: 9;
      width: 40px;
      height: 40px;
      min-width: 0;
      min-height: 0;
      padding: 0;
      border: 1px solid rgba(197, 207, 220, .95);
      border-radius: 50%;
      background: rgba(255,255,255,.88);
      color: #445064;
      font-size: 1.35rem;
      line-height: 1;
      box-shadow: 0 8px 18px rgba(23,32,45,.12), inset 0 1px 0 rgba(255,255,255,.95);
      -webkit-tap-highlight-color: transparent;
    }

    .game-exit:active {
      transform: translateY(2px);
      box-shadow: 0 4px 10px rgba(23,32,45,.10), inset 0 1px 0 rgba(255,255,255,.95);
    }

    .board-wrap {
      min-height: 0;
      display: grid;
      place-items: center;
      border: 0;
      border-radius: 0;
      background: #fff;
      padding: 0;
      overflow: visible;
      overscroll-behavior: contain;
      touch-action: pan-x pan-y;
      -webkit-overflow-scrolling: touch;
    }

    .board {
      display: grid;
      grid-template-columns: var(--target) repeat(var(--size), var(--cell));
      grid-template-rows: repeat(var(--size), var(--cell)) var(--target);
      gap: 0;
      position: relative;
      isolation: isolate;
      width: max-content;
      margin: 0 auto;
      padding: 0;
      background: #fff;
    }

    .picture {
      grid-column: 2 / span var(--size);
      grid-row: 1 / span var(--size);
      z-index: 0;
      border: 0;
      background: var(--puzzle-image);
      background-size: cover;
      background-position: center;
    }

    .target, .cell {
      position: relative;
      z-index: 1;
      border: 1px solid rgba(255,255,255,.86);
      display: grid;
      place-items: center;
      text-align: center;
      width: 100%;
      height: 100%;
      min-width: 0;
      min-height: 0;
    }

    .target {
      background: #edf1f7;
      color: #5e6b7b;
      padding: 0;
      line-height: 1.1;
      font-size: .72rem;
      font-weight: 900;
      border-radius: 3px;
      box-shadow: inset 0 0 0 1px rgba(211,217,227,.55);
    }

    .target strong {
      display: block;
      color: #5e6b7b;
      font-size: .82rem;
    }

    .target.ok { color: var(--good); }
    .target.over { color: var(--bad); }

    .cell {
      color: rgba(23, 32, 45, .78);
      font-size: clamp(.82rem, calc(var(--cell) * .48), 1.2rem);
      font-weight: 500;
      border-radius: 0;
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.38);
      padding: 0;
      user-select: none;
      -webkit-user-select: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: opacity .22s ease, transform .12s ease;
    }

    .cell.confirmed {
      color: #d71935;
      text-shadow: none;
      box-shadow: none;
    }

    .cell.erased {
      color: rgba(23,32,45,.2);
    }

    .cell.revealed {
      pointer-events: none;
      transform: none;
      font-weight: 700;
      text-shadow: 0 1px 0 rgba(255,255,255,.35);
      box-shadow: inset 0 0 0 1px rgba(255,255,255,.22);
    }

    .cell.confirmed.revealed {
      color: #c7142e;
    }

    .cell.erased.revealed {
      color: rgba(23,32,45,.62);
    }

    .cell.miss {
      animation: miss .32s ease, redGlow .62s ease;
      border-color: var(--bad);
      box-shadow: inset 0 0 0 999px rgba(207,35,61,.24);
    }

    @keyframes miss {
      0%, 100% { transform: translateX(0); }
      30% { transform: translateX(-5px); }
      70% { transform: translateX(5px); }
    }

    @keyframes redGlow {
      0%, 100% { filter: saturate(1); }
      45% { filter: saturate(1.8) brightness(1.18); }
    }

    .screen-shake {
      animation: screenShake .28s ease;
    }

    @keyframes screenShake {
      0%, 100% { transform: translate3d(0,0,0); }
      18% { transform: translate3d(-3px,2px,0); }
      36% { transform: translate3d(4px,-2px,0); }
      54% { transform: translate3d(-2px,-1px,0); }
      72% { transform: translate3d(2px,1px,0); }
    }

    .region-sum {
      position: absolute;
      left: 2px;
      top: 2px;
      z-index: 2;
      min-width: 0;
      padding: 0 2px;
      border: 0;
      border-radius: 0;
      background: #d9dde6;
      color: #222;
      font-size: clamp(.55rem, calc(var(--cell) * .28), .76rem);
      font-weight: 500;
      line-height: 1;
      pointer-events: none;
    }

    .message {
      display: none;
    }

    .message.warn { color: var(--bad); }
    .message.win { color: var(--good); }

    .modal {
      position: fixed;
      inset: 0;
      display: none;
      place-items: center;
      z-index: 20;
      padding: 20px;
      background: rgba(23, 32, 45, .34);
    }

    .modal.active { display: grid; }

    .modal-box {
      width: min(420px, 100%);
      border: 3px solid var(--line);
      border-radius: 14px;
      background: rgba(255,255,255,.96);
      padding: 24px;
      text-align: center;
      box-shadow: 0 20px 70px rgba(23,32,45,.22);
    }

    .modal-box h2 { margin: 0 0 8px; font-size: 2rem; }
    .modal-box p { margin: 0 0 18px; color: var(--muted); font-weight: 750; }

    .modal-actions {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
    }

    .modal-actions .danger {
      background: linear-gradient(180deg, #ff8d9b, #f34b60 58%, #c7263b);
      color: #fff;
      box-shadow: inset 0 3px 0 rgba(255,255,255,.52), inset 0 -4px 0 rgba(88,16,28,.16), 0 10px 20px rgba(23,32,45,.12);
    }

    .clear-box {
      width: min(560px, 100%);
      position: relative;
      overflow: hidden;
      animation: clearPop .46s cubic-bezier(.18, .86, .2, 1.08) both;
    }

    .clear-fanfare {
      position: relative;
      min-height: 84px;
      margin: -4px 0 4px;
      display: grid;
      place-items: center;
    }

    .clear-fanfare::before,
    .clear-fanfare::after {
      content: "";
      position: absolute;
      width: 150px;
      height: 150px;
      border-radius: 50%;
      background: conic-gradient(from 12deg, #ff4968, #ffd35a, #53d37c, #55cde9, #8b6cff, #ff4968);
      opacity: .24;
      animation: fanfareSpin 1.7s linear infinite;
    }

    .clear-fanfare::after {
      width: 112px;
      height: 112px;
      animation-direction: reverse;
      opacity: .18;
    }

    .clear-fanfare span {
      position: relative;
      z-index: 1;
      display: inline-grid;
      place-items: center;
      min-width: min(82vw, 340px);
      padding: 12px 18px;
      border: 4px solid #fff;
      border-radius: 16px;
      background:
        linear-gradient(180deg, rgba(255,255,255,.62), rgba(255,255,255,0) 48%),
        linear-gradient(135deg, #ff4968, #ffb12e 48%, #22bfe5);
      color: #fff;
      font-size: clamp(2rem, 8vw, 3.6rem);
      font-weight: 950;
      line-height: 1;
      text-shadow: 0 3px 0 rgba(23,32,45,.22);
      box-shadow: inset 0 3px 0 rgba(255,255,255,.52), 0 16px 28px rgba(23,32,45,.18);
      animation: clearTextPop .78s cubic-bezier(.18, .86, .2, 1.08) both;
    }

    .clear-sparks {
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        radial-gradient(circle at 12% 24%, #ffd35a 0 4px, transparent 5px),
        radial-gradient(circle at 22% 64%, #55cde9 0 5px, transparent 6px),
        radial-gradient(circle at 80% 22%, #ff6f91 0 5px, transparent 6px),
        radial-gradient(circle at 88% 62%, #53d37c 0 4px, transparent 5px),
        radial-gradient(circle at 48% 12%, #8b6cff 0 4px, transparent 5px);
      animation: sparkBurst 1.15s ease-out both;
    }

    @keyframes clearPop {
      from { opacity: 0; transform: translateY(26px) scale(.92); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }

    @keyframes clearTextPop {
      0% { opacity: 0; transform: scale(.5) rotate(-5deg); }
      58% { opacity: 1; transform: scale(1.1) rotate(2deg); }
      100% { opacity: 1; transform: scale(1) rotate(0); }
    }

    @keyframes fanfareSpin {
      to { transform: rotate(360deg); }
    }

    @keyframes sparkBurst {
      0% { opacity: 0; transform: scale(.45); }
      24% { opacity: 1; }
      100% { opacity: 0; transform: scale(1.35); }
    }

    .clear-image {
      width: 100%;
      aspect-ratio: 1;
      border: 3px solid var(--line);
      border-radius: 14px;
      margin: 10px 0 14px;
      background: var(--clear-image);
      background-size: cover;
      background-position: center;
      box-shadow: inset 0 0 0 4px rgba(255,255,255,.25);
    }

    .gallery-box {
      width: min(920px, 100%);
      max-height: min(86dvh, 760px);
      display: grid;
      grid-template-rows: auto 1fr auto;
    }

    .gallery-grid {
      min-height: 180px;
      overflow: auto;
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 10px;
      padding: 6px;
    }

    .gallery-item {
      aspect-ratio: 1;
      border: 3px solid var(--line);
      border-radius: 12px;
      background: var(--gallery-image);
      background-size: cover;
      background-position: center;
      position: relative;
      overflow: hidden;
    }

    .gallery-item span {
      position: absolute;
      left: 8px;
      top: 8px;
      min-width: 32px;
      padding: 4px 7px;
      border-radius: 999px;
      background: rgba(255,255,255,.85);
      color: #ff4968;
      font-weight: 950;
      box-shadow: 0 4px 12px rgba(23,32,45,.14);
    }

    .gallery-empty {
      display: grid;
      place-items: center;
      min-height: 180px;
      color: var(--muted);
      font-weight: 850;
      text-align: center;
      line-height: 1.5;
    }

    .balloon-img {
      position: fixed;
      z-index: 30;
      left: 50%;
      top: 50%;
      width: min(46vw, 230px);
      pointer-events: none;
      transform: translate(-50%, -50%);
      animation: balloonPop 1.05s ease-out forwards;
      filter: drop-shadow(0 12px 16px rgba(23,32,45,.2));
    }

    @keyframes balloonPop {
      0% { opacity: 0; transform: translate(-50%, -35%) scale(.45) rotate(-8deg); }
      18% { opacity: 1; transform: translate(-50%, -58%) scale(1.1) rotate(4deg); }
      72% { opacity: 1; transform: translate(-50%, -92%) scale(1) rotate(-2deg); }
      100% { opacity: 0; transform: translate(-50%, -122%) scale(.92) rotate(3deg); }
    }

    .fail-balloon {
      width: min(76vw, 300px);
      margin: -8px auto 10px;
      display: block;
      filter: drop-shadow(0 12px 16px rgba(23,32,45,.18));
    }

    @media (max-width: 720px) {
      :root {
        --cell: min(calc((100vw - 94px) / var(--size)), calc((100dvh - 174px) / (var(--size) + 1)), 32px);
        --target: calc(var(--cell) * .92);
      }

      .screen { width: 100%; padding: 8px 0; }
      .title-box { width: 100%; padding: 44px 10px; }
      h1 { font-size: clamp(2.6rem, 13vw, 4.8rem); }
      .title-wordmark-img { width: min(96vw, 560px); }
      .title-actions { gap: 8px; margin-top: 26px; }
      .image-button { width: min(44vw, 184px); min-width: 136px; min-height: 48px; font-size: clamp(1rem, 4vw, 1.25rem); }
      .title-tile { border-width: 3px; opacity: .62; }
      .title-tile.a { left: -3%; top: 16%; }
      .title-tile.b { right: -4%; top: 19%; }
      .title-tile.c { left: 5%; bottom: 10%; }
      .title-tile.d { right: 4%; bottom: 9%; }
      .screen-head { display: grid; align-items: start; }
      .screen-head .lead { margin: 8px 0 0; }
      .stage-grid {
        grid-template-columns: repeat(auto-fit, minmax(52px, 62px));
        justify-content: center;
        gap: 7px;
      }
      .stage-card {
        width: 58px;
        height: 44px;
        min-height: 44px;
      }
      .stage-card strong { font-size: 1.18rem; }
      .gallery-grid { grid-template-columns: 1fr 1fr; }
      .game-screen {
        height: 100dvh;
        gap: 8px;
        grid-template-rows: 48px minmax(0, 1fr) 64px;
      }
      .status {
        min-height: 36px;
        padding: 0;
        font-size: 1rem;
        position: relative;
        top: 0;
        z-index: 6;
      }
      .status-meta,
      .message { display: none; }
      #backToStages {
        min-height: 36px;
        padding: 0 10px;
      }
      .tools {
        gap: 12px;
        position: relative;
        bottom: 0;
        z-index: 8;
        padding-top: 0;
        background: transparent;
      }
      button { min-height: 36px; }
      .tool { width: min(42vw, 150px); height: 52px; min-height: 52px; font-size: 1.05rem; }
      .board-wrap {
        overflow: visible;
        touch-action: manipulation;
        padding: 0;
        border-radius: 0;
      }
      .target { font-size: 0; padding: 0; }
      .target strong { font-size: clamp(.66rem, calc(var(--target) * .48), .88rem); }
      .region-sum { left: 2px; top: 2px; min-width: 0; padding: 0 2px; border-width: 0; background: #d9dde6; }
    }

    @media (prefers-reduced-motion: reduce) {
      .title-screen::before,
      .title-screen::after,
      .title-ribbon,
      .title-tile,
      .title-flash,
      .title-box,
      .title-box::after,
      .stage-screen::before,
      .stage-screen::after,
      h1,
      .title-actions {
        animation: none;
      }
    }
  </style>
</head>
<body>
  <main id="titleScreen" class="screen title-screen active">
    <div class="title-motion" aria-hidden="true">
      <div class="title-ribbon one"></div>
      <div class="title-ribbon two"></div>

    </div>

      </div>
      <div class="title-actions">

      <div><span>ライフ</span> <strong id="lifeLabel" class="hearts">♥♥♥</strong></div>

  </main>

  <div id="exitModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="exitTitle">
    <div class="modal-box">
      <h2 id="exitTitle">ステージ選択に戻る？</h2>

      <div class="modal-actions">
        <button id="exitToTitleButton" class="danger" type="button">ステージ選択へ</button>
        <button id="continueButton" class="primary" type="button">続ける</button>
      </div>
    </div>
  </div>

  <div id="gameOverModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="gameOverTitle">
    <div class="modal-box">
      <img id="failBalloon" class="fail-balloon" alt="失敗..." />
      <h2 id="gameOverTitle">ゲームオーバー</h2>
      <p>ライフがなくなりました。タイトルに戻ってやり直せます。</p>
      <div class="modal-actions">
        <button id="retryButton" type="button">もう一度</button>
        <button id="returnTitleButton" class="primary" type="button">タイトルに戻る</button>
      </div>
    </div>
  </div>

  <div id="clearModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="clearTitle">
    <div class="modal-box clear-box">
      <div class="clear-sparks" aria-hidden="true"></div>
      <div class="clear-fanfare" aria-hidden="true"><span>クリア！</span></div>
      <h2 id="clearTitle">ステージクリア！</h2>
      <div id="clearImage" class="clear-image" aria-label="完成画像"></div>
      <div class="modal-actions">
        <button id="nextStageButton" class="primary" type="button">次のステージへ</button>
        <button id="clearTitleButton" type="button">ステージ選択へ</button>
      </div>
    </div>
  </div>

  <div id="galleryModal" class="modal" role="dialog" aria-modal="true" aria-labelledby="galleryTitle">
    <div class="modal-box gallery-box">
      <h2 id="galleryTitle">ギャラリー</h2>
      <div id="galleryGrid" class="gallery-grid"></div>
      <button id="closeGalleryButton" class="primary" type="button">閉じる</button>
    </div>
  </div>

  <script>
    const palette = ["#ffdca8", "#f7a4c9", "#a8dcfa", "#fff4a8", "#d7c2ff", "#c8f0b6", "#ffc8a8", "#bfe8ff", "#f5b4da", "#fff0b8", "#bfe7d6", "#e4ceff", "#ffcfd0", "#cce5ff", "#f8d7a4", "#d8f7be", "#f4b8c8", "#b9d8ff", "#fbe4a8", "#d0f0ee"];
    const sceneSets = [
      ["朝の庭", "#a7d8ff", "#78b46d", "#7d513e", "#f3b2a4", "#f7d35f", "watering"],
      ["港の夕暮れ", "#f6a66f", "#3d7890", "#30435b", "#d86e72", "#f2ca78", "wind"],
      ["森の灯", "#1c4b4d", "#3b7354", "#334132", "#8fc48d", "#f1d87b", "leaves"],
      ["雪の街", "#d8edff", "#8aaac4", "#485b74", "#e8edf4", "#7fa6c4", "snow"],
      ["星の塔", "#13213c", "#8b6b8f", "#33284f", "#f1c45e", "#df8fb1", "books"],
      ["虹の空", "#87c8ff", "#80bd78", "#6b4a3b", "#f5a6be", "#72b6e6", "balloons"]
    ];
    const sizes = [6,6,7,7,8,8,9,9,10,10,6,7,8,9,10,6,7,8,9,10,20];

    const stageCache = Array(sizes.length).fill(null);

    const state = {
      stageIndex: 0,
      size: 6,
      regionCount: 8,
      values: [],
      solution: [],
      selected: [],
      decided: [],
      regions: [],
      rowTargets: [],
      colTargets: [],
      regionTargets: [],
      revealedRegions: [],
      tool: "confirm",
      lives: 3,
      won: false
    };

    const titleScreen = document.getElementById("titleScreen");
    const stageScreen = document.getElementById("stageScreen");
    const gameScreen = document.getElementById("gameScreen");
    const stageGrid = document.getElementById("stageGrid");
    const boardEl = document.getElementById("board");
    const stageLabel = document.getElementById("stageLabel");
    const sizeLabel = document.getElementById("sizeLabel");
    const lifeLabel = document.getElementById("lifeLabel");
    const toolLabel = document.getElementById("toolLabel");
    const messageEl = document.getElementById("message");
    const confirmTool = document.getElementById("confirmTool");
    const eraseTool = document.getElementById("eraseTool");
    const gameOverModal = document.getElementById("gameOverModal");
    const exitModal = document.getElementById("exitModal");
    const failBalloon = document.getElementById("failBalloon");
    const clearModal = document.getElementById("clearModal");
    const clearImage = document.getElementById("clearImage");
    const nextStageButton = document.getElementById("nextStageButton");
    const galleryModal = document.getElementById("galleryModal");
    const galleryGrid = document.getElementById("galleryGrid");
    const storageKey = "sumAreaPuzzleCompletedStages";
    const completedStages = loadCompletedStages();
    const praiseWords = ["Good!", "Nice!", "Great!", "Wonderful!", "Excellent!", "Amazing!"];
    const praiseBalloonSrcs = praiseWords.map((word, index) =>
      makeBalloonImage(word, ["#22a9cc", "#ff5272", "#7c3aed", "#f59e0b", "#16a34a", "#e11d48"][index], "#fff4a8", "#55cde9")
    );
    const failBalloonSrc = makeBalloonImage("失敗...", "#6b7280", "#f1f5f9", "#cf233d");
    failBalloon.src = failBalloonSrc;

    function makeStage(size, index) {
      const scene = sceneSets[index % sceneSets.length];
      const regions = makeRegions(size, index + 11);
      const values = makeValues(size, index + 3);
      const solution = makeSolution(size, regions, index + 5);
      return {
        name: `${scene[0]} ${size}×${size}`,
        displayName: index === 20 ? "おまけ 20×20" : `${scene[0]} ${size}×${size}`,
        size,
        regions,
        regionCount: Math.max(...regions.flat()) + 1,
        values,
        solution,
        scene: scene.slice(1, 6),
        mishap: scene[6],
        imageIndex: index
      };
    }

    function getStage(index) {
      if (!stageCache[index]) stageCache[index] = makeStage(sizes[index], index);
      return stageCache[index];
    }

    function makeStagePreview(index) {
      const scene = sceneSets[index % sceneSets.length];
      const size = sizes[index];
      return {
        displayName: index === 20 ? "おまけ 20×20" : `${scene[0]} ${size}×${size}`,
        size,
        scene: scene.slice(1, 6),
        mishap: scene[6],
        imageIndex: index
      };
    }

    function makeRegions(size, seed) {
      const regionCount = Math.max(1, Math.floor((size * size) / (size === 20 ? 16 : 7)));
      const regions = Array.from({ length: size }, () => Array(size).fill(-1));
      const seeds = [];

      for (let id = 0; id < regionCount; id++) {
        let best = null;
        for (let attempt = 0; attempt < size * size; attempt++) {
          const r = (seed * 7 + id * 11 + attempt * 3) % size;
          const c = (seed * 5 + id * 13 + attempt * 4) % size;
          if (regions[r][c] !== -1) continue;
          const score = seeds.reduce((min, point) => Math.min(min, Math.abs(point.r - r) + Math.abs(point.c - c)), Infinity);
          if (!best || score > best.score) best = { r, c, score };
        }
        if (!best) break;
        regions[best.r][best.c] = id;
        seeds.push(best);
      }

      let remaining = size * size - seeds.length;
      while (remaining > 0) {
        let changed = false;
        for (let id = 0; id < seeds.length && remaining > 0; id++) {
          const frontier = [];
          for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
              if (regions[r][c] !== id) continue;
              for (const [nr, nc] of neighbors(r, c, size)) {
                if (regions[nr][nc] === -1) frontier.push([nr, nc]);
              }
            }
          }
          if (!frontier.length) continue;
          frontier.sort((a, b) => regionNoise(a[0], a[1], id, seed) - regionNoise(b[0], b[1], id, seed));
          const [r, c] = frontier[0];
          regions[r][c] = id;
          remaining--;
          changed = true;
        }
        if (!changed) break;
      }

      mergeSmallRegions(regions, seeds.length, size);
      return renumberRegions(regions, size);
    }

    function neighbors(r, c, size) {
      return [[r - 1, c], [r + 1, c], [r, c - 1], [r, c + 1]].filter(([nr, nc]) => nr >= 0 && nr < size && nc >= 0 && nc < size);
    }

    function regionNoise(r, c, id, seed) {
      return Math.sin((r + 1) * 12.9898 + (c + 1) * 78.233 + (id + seed) * 37.719);
    }

    function mergeSmallRegions(regions, regionCount, size) {
      let changed = true;
      while (changed) {
        changed = false;
        const counts = countRegions(regions, regionCount, size);
        for (let id = 0; id < regionCount; id++) {
          if (!counts[id] || counts[id] >= 5) continue;
          const target = largestNeighborRegion(regions, id, size);
          if (target === null) continue;
          for (let r = 0; r < size; r++) {
            for (let c = 0; c < size; c++) {
              if (regions[r][c] === id) regions[r][c] = target;
            }
          }
          changed = true;
        }
      }
    }

    function countRegions(regions, regionCount, size) {
      const counts = Array(regionCount).fill(0);
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) counts[regions[r][c]]++;
      }
      return counts;
    }

    function largestNeighborRegion(regions, id, size) {
      const seen = new Map();
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          if (regions[r][c] !== id) continue;
          for (const [nr, nc] of neighbors(r, c, size)) {
            const other = regions[nr][nc];
            if (other !== id) seen.set(other, (seen.get(other) || 0) + 1);
          }
        }
      }
      let best = null;
      let bestCount = -1;
      seen.forEach((count, other) => {
        if (count > bestCount) {
          best = other;
          bestCount = count;
        }
      });
      return best;
    }

    function renumberRegions(regions, size) {
      const map = new Map();
      let next = 0;
      for (let r = 0; r < size; r++) {
        for (let c = 0; c < size; c++) {
          const id = regions[r][c];
          if (!map.has(id)) map.set(id, next++);
          regions[r][c] = map.get(id);
        }
      }
      return regions;
    }

    function makeValues(size, seed) {
      return Array.from({ length: size }, (_, r) =>
        Array.from({ length: size }, (_, c) => ((r * 3 + c * 5 + seed * 2 + (r * c) % 7) % 9) + 1)
      );
    }

    function makeSolution(size, regions, seed) {
      const solution = Array.from({ length: size }, (_, r) =>
        Array.from({ length: size }, (_, c) => ((r * 2 + c * 3 + seed + (r + c) % 2) % 4) < 2)
      );
      for (let r = 0; r < size; r++) {
        if (!solution[r].some(Boolean)) solution[r][(r + seed) % size] = true;
      }
      for (let c = 0; c < size; c++) {
        if (!solution.some(row => row[c])) solution[(c + seed) % size][c] = true;
      }
      const regionCount = Math.max(...regions.flat()) + 1;
      for (let id = 0; id < regionCount; id++) {
        const cells = [];
        for (let r = 0; r < size; r++) {
          for (let c = 0; c < size; c++) if (regions[r][c] === id) cells.push([r, c]);
        }
        if (!cells.some(([r, c]) => solution[r][c])) {
          const [r, c] = cells[(id + seed) % cells.length];
          solution[r][c] = true;
        }
      }
      return solution;
    }

    function svgUrl(svg) {
      return `url("data:image/svg+xml,${encodeURIComponent(svg)}")`;
    }

    function softColor(color) {
      return color;
    }

    function fadedColor(color) {
      const hex = color.replace("#", "");
      const value = hex.length === 3
        ? hex.split("").map(char => char + char).join("")
        : hex;
      const r = parseInt(value.slice(0, 2), 16);
      const g = parseInt(value.slice(2, 4), 16);
      const b = parseInt(value.slice(4, 6), 16);
      return `rgba(${r}, ${g}, ${b}, .46)`;
    }

    function svgData(svg) {
      return `data:image/svg+xml,${encodeURIComponent(svg)}`;
    }

    function makeBalloonImage(text, main, fill, shadow) {

    function makeCardImage(stage) {

    function makePuzzleImage(stage) {

      const extras = {

        snow: `
          <rect y="420" width="720" height="300" fill="#f7fbff"/>

          <circle cx="150" cy="102" r="8" fill="#fff"/><circle cx="532" cy="136" r="11" fill="#fff"/><circle cx="430" cy="82" r="7" fill="#fff"/>
          <path d="M108 360V224l82-68 82 68v136zM476 372V202l94-78 94 78v170z" fill="${deep}" opacity=".54"/>
          <path d="M124 538c138-48 276-42 414 24" fill="none" stroke="${yarnB}" stroke-width="20" stroke-linecap="round"/>`,
        books: `
          <rect width="720" height="720" fill="${sky}"/>
          <rect y="492" width="720" height="228" fill="${ground}"/>
          <rect x="88" y="96" width="90" height="396" fill="${accentA}" rx="8"/>
          <rect x="184" y="126" width="72" height="366" fill="${accentB}" rx="8"/>
          <rect x="534" y="96" width="84" height="396" fill="${deep}" rx="8" opacity=".78"/>
          <path d="M104 196h60M104 296h60M196 220h46M196 324h46M548 196h54M548 302h54" stroke="#fff" stroke-width="10" opacity=".7"/>
          <path d="M114 548c124-68 254-60 392 22 66 40 116 28 160-10" fill="none" stroke="${yarnA}" stroke-width="20" stroke-linecap="round"/>`,
        balloons: `
          <rect y="448" width="720" height="272" fill="${ground}"/>
          <circle cx="550" cy="116" r="36" fill="${accentB}"/><circle cx="616" cy="154" r="32" fill="${accentA}"/><circle cx="488" cy="162" r="30" fill="${yarnB}"/>
          <path d="M550 152c-18 74-84 116-174 136M616 188c-22 66-70 110-144 132M488 194c-12 58-48 96-112 116" fill="none" stroke="#fff" stroke-width="4" opacity=".8"/>

      const cat = `
        <g transform="translate(${catX} ${catY}) rotate(${(variant % 5) * 4 - 8})">
          <path d="M-86-82l-42-70-14 88zM86-84l50-66 4 90z" fill="#f28b32"/>
          <ellipse cx="0" cy="0" rx="132" ry="106" fill="#f5a43b"/>
          <path d="M-74-48c-42 44-54 116-18 166 42 58 136 78 212 32 52-32 76-86 62-142-48 50-110 46-178 18-38-16-74-14-110 10 0-32 10-60 32-84z" fill="#ffbd55"/>
          <circle cx="-46" cy="-22" r="14" fill="#20242b"/><circle cx="54" cy="-26" r="14" fill="#20242b"/>
          <path d="M0 4l24-4-10 20z" fill="#f05f72"/>

          <path d="M-98-8c-54-14-88-12-120 6M-96 20c-58 4-92 14-122 38M114-14c56-22 96-22 132-2M112 16c58 2 96 14 132 38" stroke="#20242b" stroke-width="6" stroke-linecap="round"/>

        </g>`;
      return svgUrl(`
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 720">
          <defs>
            <linearGradient id="sky" x1="0" x2="0" y1="0" y2="1">
              <stop stop-color="${sky}"/>
              <stop offset=".58" stop-color="#fff0bd"/>
              <stop offset="1" stop-color="${ground}"/>
            </linearGradient>
          </defs>
          <rect width="720" height="720" fill="url(#sky)"/>
          ${extras[stage.mishap] || extras.watering}
          ${cat}
          <circle cx="${130 + variant * 11 % 460}" cy="${586 - variant * 7 % 90}" r="34" fill="${yarnA}"/>
          <circle cx="${520 - variant * 13 % 360}" cy="${610 - variant * 5 % 80}" r="26" fill="${yarnB}"/>
        </svg>
      `);
    }

    function cloneGrid(grid) {
      return grid.map(row => row.slice());
    }

    function emptyGrid(size, fill = false) {
      return Array.from({ length: size }, () => Array(size).fill(fill));
    }

    function showScreen(name) {
      titleScreen.classList.toggle("active", name === "title");
      stageScreen.classList.toggle("active", name === "stage");
      gameScreen.classList.toggle("active", name === "game");
    }

    function getRegionCells(id) {
      const cells = [];
      for (let r = 0; r < state.size; r++) {
        for (let c = 0; c < state.size; c++) {
          if (state.regions[r][c] === id) cells.push([r, c]);
        }
      }
      return cells;
    }

    function computeTargets() {
      state.rowTargets = state.solution.map((row, r) =>
        row.reduce((sum, on, c) => sum + (on ? state.values[r][c] : 0), 0)
      );
      state.colTargets = Array.from({ length: state.size }, (_, c) =>
        state.solution.reduce((sum, row, r) => sum + (row[c] ? state.values[r][c] : 0), 0)
      );
      state.regionTargets = Array.from({ length: state.regionCount }, (_, id) =>
        getRegionCells(id).reduce((sum, [r, c]) => sum + (state.solution[r][c] ? state.values[r][c] : 0), 0)
      );
    }

    function getRowSum(r) {
      return state.selected[r].reduce((sum, on, c) => sum + (on ? state.values[r][c] : 0), 0);
    }

    function getColSum(c) {
      return state.selected.reduce((sum, row, r) => sum + (row[c] ? state.values[r][c] : 0), 0);
    }

    function getRegionSum(id) {
      return getRegionCells(id).reduce((sum, [r, c]) => sum + (state.selected[r][c] ? state.values[r][c] : 0), 0);
    }

    function targetClass(current, target) {
      if (current === target) return "ok";
      if (current > target) return "over";
      return "";
    }

    function regionIsComplete(id) {
      return getRegionCells(id).every(([r, c]) => state.decided[r][c] && state.selected[r][c] === state.solution[r][c]);
    }

    function updateRevealedRegions() {
      const opened = [];
      for (let id = 0; id < state.regionCount; id++) {
        if (!state.revealedRegions[id] && getRegionSum(id) === state.regionTargets[id] && regionIsComplete(id)) {
          state.revealedRegions[id] = true;
          opened.push(id);
        }
      }
      return opened;
    }

    function startStage(index) {
      const stage = getStage(index);
      state.stageIndex = index;
      state.size = stage.size;
      state.regionCount = stage.regionCount;
      state.values = cloneGrid(stage.values);
      state.solution = stage.solution.map(row => row.map(Boolean));
      state.selected = emptyGrid(stage.size, false);
      state.decided = emptyGrid(stage.size, false);
      state.regions = cloneGrid(stage.regions);
      state.revealedRegions = Array(stage.regionCount).fill(false);
      state.tool = "confirm";
      state.lives = 3;
      state.won = false;
      computeTargets();
      boardEl.style.setProperty("--puzzle-image", makePuzzleImage(stage));
      boardEl.style.setProperty("--size", stage.size);
      setTool("confirm");
      showScreen("game");
      render();
      setMessage("", "");
    }

    function render() {
      updateRevealedRegions();
      boardEl.innerHTML = '<div class="picture" aria-hidden="true"></div>';

      for (let r = 0; r < state.size; r++) {
        const rowTarget = state.rowTargets[r];
        const rowTargetEl = document.createElement("div");
        rowTargetEl.className = "target";
        rowTargetEl.style.gridColumn = "1";
        rowTargetEl.style.gridRow = String(r + 1);
        rowTargetEl.innerHTML = isRowAligned(r) ? "" : `<strong>${rowTarget}</strong>`;
        boardEl.append(rowTargetEl);

        for (let c = 0; c < state.size; c++) {
          const regionId = state.regions[r][c];
          const cell = document.createElement("button");
          const stateClass = state.decided[r][c] ? (state.selected[r][c] ? "confirmed" : "erased") : "";
          cell.type = "button";
          cell.className = `cell ${stateClass} ${state.revealedRegions[regionId] ? "revealed" : ""}`;
          cell.style.gridColumn = String(c + 2);
          cell.style.gridRow = String(r + 1);
          const baseColor = palette[regionId % palette.length];
          cell.style.background = state.revealedRegions[regionId] ? fadedColor(baseColor) : softColor(baseColor);
          cell.textContent = state.revealedRegions[regionId] ? (state.selected[r][c] ? state.values[r][c] : "") : (state.decided[r][c] && !state.selected[r][c] ? "×" : state.values[r][c]);
          cell.addEventListener("pointerup", event => {
            event.preventDefault();
            tapCell(r, c, cell);
          });
          boardEl.append(cell);
        }
      }

      for (let c = 0; c < state.size; c++) {
        const colTarget = state.colTargets[c];
        const colTargetEl = document.createElement("div");
        colTargetEl.className = "target";
        colTargetEl.style.gridColumn = String(c + 2);
        colTargetEl.style.gridRow = String(state.size + 1);
        colTargetEl.innerHTML = isColAligned(c) ? "" : `<strong>${colTarget}</strong>`;
        boardEl.append(colTargetEl);
      }

      renderRegionSums();
      updateStatus();
      if (isSolved() && !state.won) winStage();
    }

    function isRowAligned(r) {
      return getRowSum(r) === state.rowTargets[r];
    }

    function isColAligned(c) {
      return getColSum(c) === state.colTargets[c];
    }

    function renderRegionSums() {
      for (let id = 0; id < state.regionCount; id++) {
        if (state.revealedRegions[id]) continue;
        const cells = getRegionCells(id);
        const topLeft = cells.reduce((best, cell) => {
          if (!best || cell[0] < best[0] || (cell[0] === best[0] && cell[1] < best[1])) return cell;
          return best;
        }, null);
        const label = document.createElement("div");
        label.className = "region-sum";
        label.style.gridColumn = String(topLeft[1] + 2);
        label.style.gridRow = String(topLeft[0] + 1);
        label.textContent = state.regionTargets[id];
        boardEl.append(label);
      }
    }

    function tapCell(r, c, element) {
      const regionId = state.regions[r][c];
      if (state.won || state.revealedRegions[regionId] || state.decided[r][c]) return;
      const wantsConfirm = state.tool === "confirm";
      const correct = wantsConfirm === state.solution[r][c];
      if (!correct) {
        state.lives -= 1;
        element.classList.add("miss");
        shakeScreen();
        setTimeout(() => element.classList.remove("miss"), 360);
        updateStatus();
        if (state.lives <= 0) gameOver();
        else setMessage("", "");
        return;
      }

      state.decided[r][c] = true;
      state.selected[r][c] = wantsConfirm;
      const openedBefore = state.revealedRegions.filter(Boolean).length;
      render();
      const opened = state.revealedRegions.filter(Boolean).length;
      if (opened > openedBefore) showPraiseBalloon(opened);
      setMessage("", "");
    }

    function isSolved() {
      return state.decided.every((row, r) =>
        row.every((decided, c) => decided && state.selected[r][c] === state.solution[r][c])
      );
    }

    function winStage() {
      state.won = true;
      markStageCompleted(state.stageIndex);
      state.revealedRegions = Array(state.regionCount).fill(true);
      render();
      const last = state.stageIndex === sizes.length - 1;
      setMessage("", "");
      showClearModal(last);
      playFanfare();
    }

    function showClearModal(last) {
      const stage = getStage(state.stageIndex);
      clearImage.style.setProperty("--clear-image", makePuzzleImage(stage));
      nextStageButton.textContent = "次のステージへ";
      nextStageButton.style.display = last ? "none" : "";
      clearModal.classList.add("active");
    }

    function playFanfare() {
      try {
        const AudioContextClass = window.AudioContext || window.webkitAudioContext;
        if (!AudioContextClass) return;
        const ctx = new AudioContextClass();
        const notes = [523.25, 659.25, 783.99, 1046.5];
        notes.forEach((freq, index) => {
          const osc = ctx.createOscillator();
          const gain = ctx.createGain();
          osc.type = "triangle";
          osc.frequency.value = freq;
          gain.gain.setValueAtTime(0, ctx.currentTime + index * .11);
          gain.gain.linearRampToValueAtTime(.12, ctx.currentTime + index * .11 + .02);
          gain.gain.exponentialRampToValueAtTime(.001, ctx.currentTime + index * .11 + .22);
          osc.connect(gain).connect(ctx.destination);
          osc.start(ctx.currentTime + index * .11);
          osc.stop(ctx.currentTime + index * .11 + .24);
        });
        setTimeout(() => ctx.close(), 900);
      } catch {
        /* Audio is optional; visual clear animation still runs. */
      }
    }

    function gameOver() {
      shakeScreen();
      gameOverModal.classList.add("active");
    }

    function shakeScreen() {
      gameScreen.classList.remove("screen-shake");
      void gameScreen.offsetWidth;
      gameScreen.classList.add("screen-shake");
    }

    function showPraiseBalloon(opened) {
      const index = Math.min(praiseBalloonSrcs.length - 1, Math.floor((opened - 1) / Math.max(1, state.regionCount / praiseBalloonSrcs.length)));
      const img = document.createElement("img");
      img.src = praiseBalloonSrcs[index];
      img.alt = praiseWords[index];
      img.className = "balloon-img";
      document.body.append(img);
      setTimeout(() => img.remove(), 1150);
    }

    function updateStatus() {
      stageLabel.textContent = `${state.stageIndex + 1} / ${sizes.length}`;
      sizeLabel.textContent = `${state.size}×${state.size}`;
      lifeLabel.textContent = "♥".repeat(Math.max(0, state.lives)) + "♡".repeat(Math.max(0, 3 - state.lives));
      toolLabel.textContent = state.tool === "confirm" ? "確定" : "消す";
    }

    function setTool(tool) {
      state.tool = tool;
      confirmTool.classList.toggle("active", tool === "confirm");
      eraseTool.classList.toggle("active", tool === "erase");
      updateStatus();
    }

    function setMessage(text, mode) {
      messageEl.textContent = "";
      messageEl.className = "message";
    }

    function loadCompletedStages() {
      try {
        const parsed = JSON.parse(localStorage.getItem(storageKey) || "[]");
        return new Set(Array.isArray(parsed) ? parsed : []);
      } catch {
        return new Set();
      }
    }

    function saveCompletedStages() {
      localStorage.setItem(storageKey, JSON.stringify([...completedStages].sort((a, b) => a - b)));
    }

    function markStageCompleted(index) {
      if (completedStages.has(index)) return;
      completedStages.add(index);
      saveCompletedStages();
      renderStageCards();
    }

    function renderGallery() {
      galleryGrid.innerHTML = "";
      const unlocked = [...completedStages].sort((a, b) => a - b);
      if (!unlocked.length) {
        galleryGrid.innerHTML = '<div class="gallery-empty">まだ画像が解放されていません。<br>ステージをクリアするとここに並びます。</div>';
        return;
      }
      unlocked.forEach(index => {
        const stage = getStage(index);
        if (!stage) return;
        const item = document.createElement("div");
        item.className = "gallery-item";
        item.style.setProperty("--gallery-image", makePuzzleImage(stage));
        item.innerHTML = `<span>${index + 1}</span>`;
        galleryGrid.append(item);
      });
    }

    function renderStageCards() {
      stageGrid.innerHTML = "";
      sizes.forEach((_, index) => {
        const stage = makeStagePreview(index);
        const button = document.createElement("button");
        button.className = `stage-card ${completedStages.has(index) ? "completed" : ""}`;
        button.type = "button";
        button.innerHTML = `<strong>${index + 1}</strong><span class="check">✓</span>`;
        button.title = `${stage.displayName} / ${stage.size}×${stage.size}`;
        button.addEventListener("click", () => startStage(index));
        stageGrid.append(button);
      });
    }
    document.getElementById("startButton").addEventListener("click", () => showScreen("stage"));
    document.getElementById("stageBackButton").addEventListener("click", () => showScreen("title"));
    document.getElementById("galleryButton").addEventListener("click", () => {
      renderGallery();
      galleryModal.classList.add("active");
    });
    document.getElementById("closeGalleryButton").addEventListener("click", () => {
      galleryModal.classList.remove("active");
    });
    document.getElementById("backToStages").addEventListener("click", () => showScreen("stage"));
    document.getElementById("gameExitButton").addEventListener("click", () => {
      if (!state.won) exitModal.classList.add("active");
    });
    document.getElementById("continueButton").addEventListener("click", () => {
      exitModal.classList.remove("active");
    });
    document.getElementById("exitToTitleButton").addEventListener("click", () => {
      exitModal.classList.remove("active");
      showScreen("stage");
    });
    document.getElementById("returnTitleButton").addEventListener("click", () => {
      gameOverModal.classList.remove("active");
      showScreen("title");
    });
    document.getElementById("clearTitleButton").addEventListener("click", () => {
      clearModal.classList.remove("active");
      showScreen("stage");
    });
    nextStageButton.addEventListener("click", () => {
      clearModal.classList.remove("active");
      if (state.stageIndex >= sizes.length - 1) showScreen("stage");
      else startStage(state.stageIndex + 1);
    });
    document.getElementById("retryButton").addEventListener("click", () => {
      gameOverModal.classList.remove("active");
      startStage(state.stageIndex);
    });
    confirmTool.addEventListener("click", () => setTool("confirm"));
    eraseTool.addEventListener("click", () => setTool("erase"));

    renderStageCards();
  </script>
</body>
